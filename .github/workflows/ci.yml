name: Contracts verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      # Frozen migration sources retain inherited formatting differences.
      # script/ci.sh still includes fmt in its default and --offline gates;
      # this standalone workflow verifies contract behavior and interfaces.
      - name: Verify independent contracts component
        run: bash script/ci.sh build unit deploy spec interfaces
