# Foundry Configure https://getfoundry.sh/config/reference/
#
# Compiler and EVM Version here**Nailed.**:Shit. solc Autodetection will allow"Local Pass.CI But..."Such problems are exposed at a very late stage.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc = "0.8.30"
# cancun Not updated. prague/osaka:By the chain of target**Where do we get the support?**No, no, no, no, no, no.
#
# Already Robinhood Chain Measured (eth_call + state override Injecting probe bytes:
#   MCOPY(0x5e)    TSTORE/TLOAD(0x5d/0x5c)
# I'll see you at the recalculation. READMEEVM The version.OpenZeppelin v5.7 It's... Arrays.sol I wrote it straight. mcopy,
# And so... cancun It's also the lower limit of the side of dependence... shanghai I can't.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The clearing pool cannot be upgraded. The byte code is reproduced verbatim by third parties -- removed. metadata hash ..the path in depends on
bytecode_hash = "none"

# First two read only. Third is...**One**Other Organiser
#   legal/        version 0 Two paragraphs of the text. Hash now counted from the file, not copied into the code.
#                 So text and Hashi can't drift. legal/attestation-v0/README.md.
#   out/          Compile the product. The external writings set of the contract are used to prove that there is no other writing.
#                 It's not a variable. 5 / 6 The only non-recycling approach to the assertion that "prove that a switch does not exist" is to:
#                 I'm going to go over the functions I called, and I'm going to prove nothing.
#   deployments/  M1-3(issue #8)The four contracts deploy a list of addresses of the scripts to be used for subsequent milestones and verification.
#                 CRITICAL It's a directory, not a reading and writing -- the narrower the scripts are, the smaller they are, the more they are.
#                 The more the script is run, the less the script is read.
fs_permissions = [
    {access = "read", path = "./legal"},
    {access = "read", path = "./out"},
    {access = "read-write", path = "./deployments"},
]

[profile.default.fuzz]
runs = 256

# M1 Delivery of Article 7 is not variable (in thousands of United States dollars)issue #5).The budget is here. The test files are not separate. override.
[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 1000
depth = 128
fail_on_revert = false

[fmt]
# CRITICAL `src/flap/` Yes. Flap Official base category**Bytes Copy**,Formatting changes bytes...
# And "upstream by by bytes" is the only reason these documents exist. src/flap/README.md,
# By script/flap-vault-spec-check.sh Press sha256 Check.
ignore = ["src/flap/*.sol", "lib/openzeppelin-contracts-upgradeable/contracts/access/IAccessControlUpgradeable.sol"]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = false

# For `forge script --rpc-url robinhood` / `cast --rpc-url robinhood` Use.
# Fork Test**No, no.**Here -- they read from the environment variable, see. test/fork/ForkConfig.sol.
#
# WARNING This particular name.**Only recognize single ends**,So continue reading only the historical monovalent variable `RPC_ROBINHOOD`.Visible multi-ends fork test
#    Variable is `RPC_ROBINHOOD_LIST`(ASCII Blank-separated, each of them by priority; deploy and match only the list cast Visible Passage URL.
[rpc_endpoints]
robinhood = "${RPC_ROBINHOOD}"
# fork-node.sh selects and probes RPC_ROBINHOOD(_LIST), then exposes only this
# credential-free alias in child argv. Foundry expands the selected URL from
# the child's environment without writing it to this file.
fork_node_archive = "${FORK_NODE_RPC_URL}"
